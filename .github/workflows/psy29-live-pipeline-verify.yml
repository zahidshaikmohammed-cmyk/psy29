name: PSY29 Live Pipeline Deterministic Verification

on:
  push:
    paths:
      - "scripts/psy29_live_pipeline_*.py"
      - "scripts/psy29_live_signal_cycle.py"
      - "scripts/psy29_integrated_service.py"
      - "scripts/psy29_persistent_store.py"
      - "scripts/psy29_runtime_state.py"
      - "scripts/psy29_persistence_unit_tests.py"
      - "scripts/psy29_live_dhan_acquisition.py"
      - "scripts/psy29_recent_dhan_snapshot.py"
      - "scripts/test_psy29_live_indicator_contract.py"
      - "scripts/test_psy29_dhan_resilience.py"
      - "dhan/client.py"
      - "requirements-live.txt"
      - "config/psy29_live_universe_contract.json"
      - ".github/workflows/psy29-live-pipeline-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: PSY29 live pipeline deterministic verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PSY29
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-live.txt

      - name: Compile live pipeline and persistence modules
        run: |
          python -m py_compile \
            dhan/client.py \
            scripts/psy29_live_dhan_acquisition.py \
            scripts/psy29_recent_dhan_snapshot.py \
            scripts/test_psy29_live_indicator_contract.py \
            scripts/test_psy29_dhan_resilience.py \
            scripts/psy29_live_pipeline_fixture.py \
            scripts/psy29_live_pipeline_bridge.py \
            scripts/psy29_live_pipeline_service_cycle.py \
            scripts/psy29_live_signal_cycle.py \
            scripts/psy29_integrated_service.py \
            scripts/psy29_persistent_store.py \
            scripts/psy29_runtime_state.py \
            scripts/psy29_live_service.py

      - name: Verify production 1M indicator contract
        run: |
          python scripts/test_psy29_live_indicator_contract.py

      - name: Verify DHAN retry and completeness contract
        run: |
          python scripts/test_psy29_dhan_resilience.py

      - name: Verify production add_indicators_1m API signature
        run: |
          python - <<'PY'
          import inspect
          from scripts.psy29_live_dhan_acquisition import add_indicators_1m
          params=list(inspect.signature(add_indicators_1m).parameters)
          assert params==['df','session_date','now'], params
          print('add_indicators_1m(df, session_date, now): PASS')
          PY

      - name: Verify recent-session production call site
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('scripts/psy29_recent_dhan_snapshot.py').read_text(encoding='utf-8')
          assert 'add_indicators_1m(df,session_date,now)' in text or 'add_indicators_1m(df, session_date, now)' in text
          assert 'add_indicators_1m(df)' not in text
          print('RECENT DHAN INDICATOR CALL-SITE: PASS')
          PY

      - name: Verify market-hours fixture hard stop
        run: |
          python - <<'PY'
          import contextlib
          import io
          import sys
          import scripts.psy29_live_pipeline_service_cycle as m
          m.market_session=lambda: True
          sys.argv=['psy29_live_pipeline_service_cycle.py','--mode','fixture']
          try:
              with contextlib.redirect_stderr(io.StringIO()):
                  m.main()
          except SystemExit as exc:
              assert 'fixture mode is forbidden during NSE market hours' in str(exc), exc
          else:
              raise AssertionError('Fixture mode was not blocked during simulated market hours')
          print('MARKET-HOURS FIXTURE HARD STOP: PASS')
          PY

      - name: Run persistence regression tests
        run: |
          python scripts/psy29_persistence_unit_tests.py

      - name: Run deterministic off-market pipeline gate
        run: |
          rm -rf output/pipeline-fixture
          python scripts/psy29_live_pipeline_service_cycle.py --mode fixture
          test -f runtime/live/live_pipeline_input.csv
          test -f runtime/live/live_pipeline_input_validation.json

      - name: HARD VERIFY deterministic pipeline input
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          v=json.load(open('runtime/live/live_pipeline_input_validation.json',encoding='utf-8'))
          assert v['status']=='PASS', v
          assert v['contract']=='PSY29_LIVE_PIPELINE_INPUT', v
          assert v['mode']=='fixture', v
          assert v['live_data'] is False, v
          assert v['coverage']=={'expected':29,'actual':29,'unique':29}, v
          assert v['fixture_count']==29, v
          assert v['signal_generation'] is False, v
          assert v['order_execution'] is False, v
          s=pd.read_csv('runtime/live/live_pipeline_input.csv')
          assert len(s)==29 and s['symbol'].nunique()==29
          assert (s['freshness_status']=='FIXTURE').all()
          required={'symbol','timestamp','last_price','vwap','ema9','ema20','first15_high','first15_low','security_id','exchange_segment'}
          assert required.issubset(s.columns), sorted(required-set(s.columns))
          print('PSY29 LIVE PIPELINE DETERMINISTIC GATE: HARD VERIFY PASS')
          print('29/29 fixture rows: PASS')
          print('Persistence regression: PASS')
          print('1M indicator contract: PASS')
          print('DHAN resilience + completeness: PASS')
          print('Explicitly non-live: PASS')
          PY
