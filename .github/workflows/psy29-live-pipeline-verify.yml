name: PSY29 Live Pipeline Deterministic Verification

on:
  push:
    paths:
      - "scripts/psy29_live_pipeline_*.py"
      - "scripts/psy29_live_signal_cycle.py"
      - "scripts/psy29_integrated_service.py"
      - "scripts/psy29_persistent_store.py"
      - "scripts/psy29_runtime_state.py"
      - "scripts/psy29_persistence_unit_tests.py"
      - "requirements-live.txt"
      - "config/psy29_live_universe_contract.json"
      - ".github/workflows/psy29-live-pipeline-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: PSY29 live pipeline fixture gate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout PSY29
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-live.txt

      - name: Compile live pipeline and persistence modules
        run: |
          python -m py_compile \
            scripts/psy29_live_pipeline_fixture.py \
            scripts/psy29_live_pipeline_bridge.py \
            scripts/psy29_live_pipeline_service_cycle.py \
            scripts/psy29_live_signal_cycle.py \
            scripts/psy29_integrated_service.py \
            scripts/psy29_persistent_store.py \
            scripts/psy29_runtime_state.py \
            scripts/psy29_live_service.py

      - name: Run persistence regression tests
        run: |
          python scripts/psy29_persistence_unit_tests.py

      - name: Run deterministic off-market pipeline gate
        run: |
          rm -rf output/pipeline-fixture
          python scripts/psy29_live_pipeline_service_cycle.py --mode fixture
          test -f runtime/live/live_pipeline_input.csv
          test -f runtime/live/live_pipeline_input_validation.json

      - name: HARD VERIFY deterministic pipeline input
        run: |
          python - <<'PY'
          import json
          import pandas as pd

          v=json.load(open('runtime/live/live_pipeline_input_validation.json',encoding='utf-8'))
          assert v['status']=='PASS', v
          assert v['contract']=='PSY29_LIVE_PIPELINE_INPUT', v
          assert v['mode']=='fixture', v
          assert v['live_data'] is False, v
          assert v['coverage']=={'expected':29,'actual':29,'unique':29}, v
          assert v['fixture_count']==29, v
          assert v['signal_generation'] is False, v
          assert v['order_execution'] is False, v

          s=pd.read_csv('runtime/live/live_pipeline_input.csv')
          assert len(s)==29 and s['symbol'].nunique()==29
          assert (s['freshness_status']=='FIXTURE').all()
          required={'symbol','timestamp','last_price','vwap','ema9','ema20','first15_high','first15_low','security_id','exchange_segment'}
          assert required.issubset(s.columns), sorted(required-set(s.columns))
          print('PSY29 LIVE PIPELINE DETERMINISTIC GATE: HARD VERIFY PASS')
          print('29/29 fixture rows: PASS')
          print('Persistence regression: PASS')
          print('Explicitly non-live: PASS')
          PY
