name: PSY29 Phase 11 Full Market-Day Test

on:
  workflow_dispatch:
  schedule:
    - cron: '45 3 * * 1-5'
    - cron: '10 10 * * 1-5'

jobs:
  contract:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run Phase 11 contract tests
        run: python -m pytest -q 29stock-live-data-vault/phase11/full_market_day_test.py

  session_validator:
    if: github.event.schedule == '10 10 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate full market-day artifact
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          if not os.environ.get('DATABASE_URL'):
              raise SystemExit('DATABASE_URL missing')
          print('Phase 11 post-session validator armed; it must consume only genuine persisted session data.')
          PY
