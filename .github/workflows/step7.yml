name: PSY29 Step 7 - Intraday Liquidity Gate

on:
  workflow_dispatch:
    inputs:
      step6_run_id:
        description: 'Successful PSY29 Step 6 V3 workflow run ID'
        required: true
        default: '31711962980'
      step2_run_id:
        description: 'Successful PSY29 Step 2 acquisition run ID'
        required: true
        default: '31702235542'

jobs:
  liquidity-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PSY29
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow

      - name: Download Step 2 dataset
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.step2_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: psy29-step2-intraday-*
          path: input/data
          merge-multiple: true

      - name: Locate parquet dataset
        shell: bash
        run: |
          mkdir -p input/data/raw/intraday
          find input/data -type f -name '*.parquet' -print0 | xargs -0 -r -I{} cp "{}" input/data/raw/intraday/
          count=$(find input/data/raw/intraday -type f -name '*.parquet' | wc -l)
          echo "Parquet files found: $count"
          test "$count" -gt 0

      - name: Download Step 6 V3 artifact
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.step6_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: psy29-step6-v3-walk-forward
          path: input/step6

      - name: Locate Step 6 ranking
        shell: bash
        run: |
          RANKING=$(find input/step6 -type f -name 'edge_event_oos_research_ranking.csv' | head -1)
          test -n "$RANKING"
          echo "RANKING=$RANKING" >> "$GITHUB_ENV"
          echo "Using $RANKING"

      - name: Run PSY29 Step 7 liquidity gate
        run: python scripts/step7_liquidity_gate.py --input input/data/raw/intraday --edge-ranking "$RANKING" --output output/step7

      - name: Verify Step 7 output
        shell: bash
        run: |
          test -s output/step7/step7_liquidity_audit.csv
          test -s output/step7/step7_liquidity_passed.csv
          test -s output/step7/step7_summary.json
          echo "Step 7 output verified."

      - name: Upload Step 7 artifact
        uses: actions/upload-artifact@v4
        with:
          name: psy29-step7-liquidity-gate
          path: output/step7
          retention-days: 30
