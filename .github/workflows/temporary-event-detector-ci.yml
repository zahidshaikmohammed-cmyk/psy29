name: PSY29 Temporary Event Detector CI

on:
  push:
    branches:
      - research-event-detector-ci-verify-20260815

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run isolated Event Detector suite
        run: python -m pytest -q tests/test_event_detector.py tests/test_event_detector_v2_integration.py tests/test_event_threshold_resolver.py
