name: PSY29 Stage 20 - Final Trading Signal Engine
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage20:
    name: PSY29 Stage 20 Hard Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PSY29
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Stage 20 files
        run: |
          set -e
          test -f config/psy29_stage20_final_trading_signal_contract.json
          test -f scripts/stage20_final_trading_signal_engine.py
          test -f scripts/stage20_test_fixture.py
          test -f scripts/stage20_check.py
      - name: Compile Stage 20 Python
        run: |
          python -m py_compile scripts/stage20_final_trading_signal_engine.py
          python -m py_compile scripts/stage20_test_fixture.py
          python -m py_compile scripts/stage20_check.py
          echo 'STAGE 20 PYTHON SYNTAX: PASS'
      - name: Validate canonical 29
        run: |
          python - <<'PY'
          import json
          d=json.load(open('config/psy29_live_universe_contract.json',encoding='utf-8'))
          s=[str(x['symbol']).strip().upper() for x in d['universe']]
          assert len(s)==29 and len(set(s))==29
          print('CANONICAL 29: PASS')
          PY
      - name: Validate Stage 20 contract
        run: |
          python - <<'PY'
          import json
          c=json.load(open('config/psy29_stage20_final_trading_signal_contract.json',encoding='utf-8'))
          assert c['stage']==20 and c['version']=='1.0' and c['status']=='LOCKED'
          assert c['coverage']==29
          assert c['signal_policy']['multiple_signals_allowed'] is True
          assert c['signal_policy']['daily_signal_cap'] is None
          assert c['signal_policy']['traded_stock_permanent_blacklist'] is False if 'traded_stock_permanent_blacklist' in c['signal_policy'] else True
          assert c['strategy_authority']['entry_owner']=='selected_strategy'
          assert c['strategy_authority']['stop_loss_owner']=='selected_strategy'
          assert c['strategy_authority']['take_profit_owner']=='selected_strategy'
          assert c['strategy_authority']['generic_rr_fallback_forbidden'] is True
          print('STAGE 20 CONTRACT: PASS')
          PY
      - name: Create deterministic Stage 20 fixture
        run: |
          rm -rf /tmp/psy29_stage20 /tmp/psy29_stage20_output
          python scripts/stage20_test_fixture.py --universe config/psy29_live_universe_contract.json --output /tmp/psy29_stage20
      - name: Run Stage 20
        run: |
          python scripts/stage20_final_trading_signal_engine.py \
            --contract config/psy29_stage20_final_trading_signal_contract.json \
            --universe config/psy29_live_universe_contract.json \
            --stage11 /tmp/psy29_stage20/stage11.csv \
            --stage16 /tmp/psy29_stage20/stage16.csv \
            --stage19 /tmp/psy29_stage20/stage19.csv \
            --memory /tmp/psy29_stage20/memory.csv \
            --output /tmp/psy29_stage20_output
      - name: Verify outputs
        run: |
          test -f /tmp/psy29_stage20_output/PSY29_STAGE20_FINAL_SIGNAL_BOARD.json
          test -f /tmp/psy29_stage20_output/PSY29_STAGE20_FINAL_SIGNALS.csv
          test -f /tmp/psy29_stage20_output/PSY29_STAGE20_SIGNAL_MEMORY.json
          test -f /tmp/psy29_stage20_output/PSY29_STAGE20_VALIDATION.json
          echo 'STAGE 20 OUTPUTS: PASS'
      - name: HARD VERIFY Stage 20
        run: |
          python scripts/stage20_check.py \
            --contract config/psy29_stage20_final_trading_signal_contract.json \
            --universe config/psy29_live_universe_contract.json \
            --output /tmp/psy29_stage20_output
      - name: Verify multi-signal and memory behavior
        run: |
          python - <<'PY'
          import json
          b=json.load(open('/tmp/psy29_stage20_output/PSY29_STAGE20_FINAL_SIGNAL_BOARD.json',encoding='utf-8'))
          assert b['signal_count']==2
          assert b['coverage']=={'expected':29,'actual':29,'unique':29}
          assert b['daily_signal_cap'] is None
          print('MULTI-SIGNAL: PASS')
          print('2 new signals from 29-stock universe: PASS')
          print('2 active/traded duplicates suppressed: PASS')
          print('No artificial daily cap: PASS')
          PY
      - name: Upload Stage 20 validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: psy29-stage20-final-signal
          path: /tmp/psy29_stage20_output/
          if-no-files-found: error
