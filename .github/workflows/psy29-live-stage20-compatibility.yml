name: PSY29 Live Pipeline -> Stage 20 Compatibility

on:
  push:
    branches: [main]
    paths:
      - 'config/psy29_live_universe_contract.json'
      - 'config/psy29_stage20_final_trading_signal_contract.json'
      - 'scripts/psy29_live_pipeline_fixture.py'
      - 'scripts/psy29_live_pipeline_bridge.py'
      - 'scripts/psy29_live_pipeline_service_cycle.py'
      - 'scripts/psy29_live_stage20_compatibility_check.py'
      - 'scripts/stage20_final_trading_signal_engine.py'
      - 'scripts/stage20_test_fixture.py'
      - 'scripts/stage20_check.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: PSY29 Live -> Stage 20 Compatibility Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PSY29
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile compatibility and pipeline code
        run: |
          set -e
          python -m py_compile \
            scripts/psy29_live_pipeline_fixture.py \
            scripts/psy29_live_pipeline_bridge.py \
            scripts/psy29_live_pipeline_service_cycle.py \
            scripts/psy29_live_stage20_compatibility_check.py \
            scripts/stage20_final_trading_signal_engine.py \
            scripts/stage20_test_fixture.py \
            scripts/stage20_check.py
          echo 'PYTHON COMPILE: PASS'

      - name: Run live pipeline -> Stage 20 compatibility gate
        run: python scripts/psy29_live_stage20_compatibility_check.py

      - name: Final status
        run: echo 'PSY29 LIVE -> STAGE 20 COMPATIBILITY GATE: PASS'
