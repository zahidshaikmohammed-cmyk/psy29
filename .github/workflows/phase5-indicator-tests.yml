name: PSY29 Phase 5 Indicator Verification

on:
  push:
    branches:
      - phase5/indicator-engine-impl2
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 29stock-live-data-vault/phase5
    steps:
      - uses: actions/checkout@v4
      - name: Run indicator formula and 29-stock tests
        run: python -m unittest discover -s . -p 'test_*.py'
      - name: Phase 5 implementation trigger
        run: echo "Phase 5 verification executed"
