name: PSY29 Phase 3 Collection 09:15-12:30 IST

on:
  schedule:
    - cron: '45 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    defaults:
      run:
        working-directory: 29stock-live-data-vault/phase3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect official one-minute snapshots
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
        run: python one_minute_collector.py --start 09:15 --end 12:30
      - name: Persist collected snapshots
        working-directory: .
        run: |
          git config user.name "PSY29 Phase 3 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add 29stock-live-data-vault/phase3/snapshots
          git diff --cached --quiet && echo "No new snapshots" || git commit -m "phase3: persist morning one-minute snapshots"
          git push origin HEAD:${GITHUB_REF_NAME}
