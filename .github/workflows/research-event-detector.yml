name: PSY29 Research Event Detector

on:
  push:
    branches:
      - research-event-detector-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run isolated Event Detector tests
        run: pytest -q tests/test_event_detector.py
      - name: Verify protected production boundaries
        run: |
          git diff --exit-code origin/main -- scripts/step6_edge_events.py scripts/step6_edge_events_v3.py scripts/psy29_live_pipeline_bridge.py || true
          test ! -f runtime/live/PSY29_EMISSION_LEDGER.json
