name: PSY29 Step 5 - Archetype Discovery Engine

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Step 4 V2 workflow run ID"
        required: true
        default: "31706659838"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  archetype-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PSY29
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'pandas>=2.2,<3' 'numpy>=2.0,<3' 'scikit-learn>=1.5,<2'
      - name: Download Step 4 V2 features
        uses: actions/download-artifact@v4
        with:
          name: psy29-step4-behaviour-features-v2
          path: input/step4
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: Run Step 5 archetype discovery
        run: python scripts/step5_archetypes.py --input input/step4/stock_behaviour_features_v2.csv --output output/step5
      - name: Write provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/step5/step5_summary.json'); d=json.loads(p.read_text())
          d['source_run_id']=int('${{ inputs.source_run_id }}')
          d['source_artifact']='psy29-step4-behaviour-features-v2'
          p.write_text(json.dumps(d,indent=2))
          PY
      - name: Upload Step 5 archetype artifact
        uses: actions/upload-artifact@v4
        with:
          name: psy29-step5-archetypes
          path: output/step5/
          retention-days: 30
          if-no-files-found: error
