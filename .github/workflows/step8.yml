name: PSY29 Step 8 - Final 29 Selection Engine

on:
  workflow_dispatch:
    inputs:
      step6_run_id:
        description: "Successful PSY29 Step 6 V3 workflow run ID"
        required: true
        default: "31711962980"
      step7_run_id:
        description: "Successful PSY29 Step 7 workflow run ID"
        required: true
        default: "31712419256"

permissions:
  contents: read
  actions: read

jobs:
  final-29:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PSY29
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow

      - name: Prepare input directories
        run: |
          mkdir -p input/step6 input/step7 output/step8

      - name: Download Step 6 V3 artifact
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.step6_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: psy29-step6-v3-walk-forward
          path: input/step6

      - name: Download Step 7 liquidity artifact
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.step7_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: psy29-step7-liquidity-gate
          path: input/step7

      - name: Detect and validate Step 6 ranking
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          root = Path("input/step6")
          files = list(root.rglob("*.csv"))
          print("Step 6 CSV files:", [str(x) for x in files])

          required = {
              "symbol",
              "oos_edge_score_v3",
              "oos_sessions",
              "oos_trend_event_count",
              "oos_trend_event_rate",
              "oos_strong_trend_event_rate",
              "oos_or_continuation_rate",
          }

          matches = []
          for path in files:
              try:
                  columns = set(pd.read_csv(path, nrows=0).columns)
                  if required.issubset(columns):
                      matches.append(path)
              except Exception:
                  pass

          if not matches:
              raise SystemExit("No valid Step 6 ranking CSV found.")

          source = matches[0]
          df = pd.read_csv(source)
          df.to_csv("input/step6/edge_ranking.csv", index=False)
          print(f"Detected Step 6 ranking: {source}")
          print(f"Rows: {len(df)}")
          PY

      - name: Detect and validate Step 7 liquidity audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          root = Path("input/step7")
          files = list(root.rglob("*.csv"))
          print("Step 7 CSV files:", [str(x) for x in files])

          required = {
              "symbol",
              "liquidity_pass",
              "liquidity_score",
              "edge_liquidity_score",
          }

          matches = []
          for path in files:
              try:
                  columns = set(pd.read_csv(path, nrows=0).columns)
                  if required.issubset(columns):
                      matches.append(path)
              except Exception:
                  pass

          if not matches:
              raise SystemExit("No valid Step 7 liquidity audit CSV found.")

          source = matches[0]
          df = pd.read_csv(source)
          df.to_csv("input/step7/liquidity_audit.csv", index=False)
          print(f"Detected Step 7 liquidity audit: {source}")
          print(f"Rows: {len(df)}")
          print(f"Liquidity pass count: {int(df['liquidity_pass'].sum())}")
          PY

      - name: Run PSY29 Step 8
        run: |
          python scripts/step8_final_29.py \
            --edge-ranking input/step6/edge_ranking.csv \
            --liquidity-audit input/step7/liquidity_audit.csv \
            --output output/step8

      - name: HARD VERIFY EXACTLY 29
        run: |
          python - <<'PY'
          import json
          import pandas as pd

          summary = json.load(open("output/step8/step8_summary.json"))
          final = pd.read_csv("output/step8/PSY29_FINAL_29.csv")

          print(json.dumps(summary, indent=2))
          print(f"FINAL STOCK COUNT: {len(final)}")

          if len(final) != 29:
              raise SystemExit(f"FAIL: Expected exactly 29, got {len(final)}")
          if final["symbol"].duplicated().any():
              raise SystemExit("FAIL: Duplicate stock symbols detected.")
          if not final["final_psy29"].all():
              raise SystemExit("FAIL: final_psy29 flag invalid.")

          print("EXACTLY 29 STOCKS VERIFIED.")
          PY

      - name: Display FINAL PSY29
        run: |
          echo "====================================="
          echo "       FINAL PSY29 - 29 STOCKS"
          echo "====================================="
          cat output/step8/PSY29_FINAL_29.csv
          echo "====================================="

      - name: Upload PSY29 final artifact
        uses: actions/upload-artifact@v4
        with:
          name: psy29-final-29
          path: output/step8
          retention-days: 90
