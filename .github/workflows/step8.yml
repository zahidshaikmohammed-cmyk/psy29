name: PSY29 Step 8 - Final 29 Selection Engine

on:
  workflow_dispatch:
    inputs:
      step6_run_id:
        description: "Successful PSY29 Step 6 V3 workflow run ID"
        required: true
        default: "31711962980"
      step7_run_id:
        description: "Successful PSY29 Step 7 workflow run ID"
        required: true
        default: "31712419256"

permissions:
  contents: read
  actions: read

jobs:
  final-29:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PSY29
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow

      - name: Prepare input directories
        run: |
          mkdir -p input/step6
          mkdir -p input/step7
          mkdir -p output/step8

      - name: Download Step 6 V3 artifact
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.step6_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: psy29-step6-v3-walk-forward
          path: input/step6
          merge-multiple: true

      - name: Download Step 7 liquidity artifact
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.step7_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: psy29-step7-liquidity
          path: input/step7
          merge-multiple: true

      - name: Locate Step 6 ranking
        shell: bash
        run: |
          echo "Searching Step 6 artifact..."
          find input/step6 -type f -print

          STEP6_FILE=$(find input/step6 \
            -type f \
            -name "edge_event_oos_research_ranking.csv" \
            | head -n 1)

          if [ -z "$STEP6_FILE" ]; then
            echo "ERROR: Step 6 V3 ranking file not found."
            exit 1
          fi

          cp "$STEP6_FILE" input/step6/edge_ranking.csv

          echo "Step 6 ranking:"
          wc -l input/step6/edge_ranking.csv

      - name: Locate Step 7 liquidity audit
        shell: bash
        run: |
          echo "Searching Step 7 artifact..."
          find input/step7 -type f -print

          LIQ_FILE=$(find input/step7 \
            -type f \
            \( \
              -name "liquidity_audit.csv" \
              -o \
              -name "step7_liquidity_audit.csv" \
              -o \
              -name "liquidity_gate.csv" \
            \) \
            | head -n 1)

          if [ -z "$LIQ_FILE" ]; then
            echo "ERROR: Step 7 liquidity audit file not found."
            exit 1
          fi

          cp "$LIQ_FILE" input/step7/liquidity_audit.csv

          echo "Step 7 liquidity audit:"
          wc -l input/step7/liquidity_audit.csv

      - name: Validate input schemas
        run: |
          python - <<'PY'
          import pandas as pd

          edge = pd.read_csv("input/step6/edge_ranking.csv")
          liq = pd.read_csv("input/step7/liquidity_audit.csv")

          edge_required = {
              "symbol",
              "oos_edge_score_v3",
              "oos_sessions",
              "oos_trend_event_count",
              "oos_trend_event_rate",
              "oos_strong_trend_event_rate",
              "oos_or_continuation_rate",
          }

          liq_required = {
              "symbol",
              "liquidity_pass",
              "liquidity_score",
              "edge_liquidity_score",
          }

          missing_edge = edge_required - set(edge.columns)
          missing_liq = liq_required - set(liq.columns)

          if missing_edge:
              raise SystemExit(
                  f"Missing Step 6 columns: {sorted(missing_edge)}"
              )

          if missing_liq:
              raise SystemExit(
                  f"Missing Step 7 columns: {sorted(missing_liq)}"
              )

          print(f"Step 6 rows: {len(edge)}")
          print(f"Step 7 rows: {len(liq)}")
          print("Input schemas validated.")
          PY

      - name: Run PSY29 Step 8
        run: |
          python scripts/step8_final_29.py \
            --edge-ranking input/step6/edge_ranking.csv \
            --liquidity-audit input/step7/liquidity_audit.csv \
            --output output/step8

      - name: HARD VERIFY EXACTLY 29
        run: |
          python - <<'PY'
          import json
          import pandas as pd

          summary = json.load(
              open("output/step8/step8_summary.json")
          )

          final = pd.read_csv(
              "output/step8/PSY29_FINAL_29.csv"
          )

          print(json.dumps(summary, indent=2))
          print()
          print(f"FINAL STOCK COUNT: {len(final)}")

          if len(final) != 29:
              raise SystemExit(
                  f"FAIL: Expected exactly 29, got {len(final)}"
              )

          if final["symbol"].duplicated().any():
              raise SystemExit(
                  "FAIL: Duplicate stock symbols detected."
              )

          if not final["final_psy29"].all():
              raise SystemExit(
                  "FAIL: final_psy29 flag invalid."
              )

          print("EXACTLY 29 STOCKS VERIFIED.")
          PY

      - name: Display FINAL PSY29
        run: |
          echo "====================================="
          echo "       FINAL PSY29 — 29 STOCKS"
          echo "====================================="
          cat output/step8/PSY29_FINAL_29.csv
          echo "====================================="

      - name: Upload PSY29 final artifact
        uses: actions/upload-artifact@v4
        with:
          name: psy29-final-29
          path: output/step8
          retention-days: 90
