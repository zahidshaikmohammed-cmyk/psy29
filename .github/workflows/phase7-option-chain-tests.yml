name: PSY29 Phase 7 Derivatives Option Data Verification
on:
  push:
    branches: [phase7/derivatives-option-data]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 29stock-live-data-vault/phase7
    steps:
      - uses: actions/checkout@v4
      - name: Verify option-data boundary and persistence
        run: python -m unittest discover -s . -p 'test_*.py'
      - name: Verify provider contract
        run: python option_chain_engine.py
      - name: Verify persisted artifact
        run: python -c "import json; d=json.load(open('option-chain-live.json')); assert d['provider']=='DHAN'; assert d['persistence'] is True; assert d['records']==[]"
