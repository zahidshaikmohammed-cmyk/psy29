name: PSY29 Stage 6 - Live Regime Engine V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage6:
    name: Validate PSY29 Live Regime Engine V2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PSY29
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Verify required PSY29 contracts
        run: |
          test -f config/psy29_live_universe_contract.json
          test -f config/psy29_live_dhan_data_contract.json
          test -f config/psy29_edge_profiles_v1.json
          test -f scripts/step9_live_regime_v2.py

      - name: Verify canonical 29 count
        run: |
          python - <<'PY'
          import json
          with open("config/psy29_live_universe_contract.json") as f:
              data = json.load(f)
          symbols = [x["symbol"] for x in data["universe"]]
          assert len(symbols) == 29
          assert len(set(symbols)) == 29
          assert symbols == [
              "NESTLEIND", "VEDL", "ICICIPRULI", "KALYANKJIL", "KOTAKBANK",
              "BANDHANBNK", "BANKBARODA", "TITAN", "INFY", "DLF", "TCS",
              "MAXHEALTH", "KFINTECH", "PRESTIGE", "BHEL", "RBLBANK", "HCLTECH",
              "ICICIGI", "HDFCLIFE", "MARICO", "LUPIN", "COFORGE", "TECHM",
              "SWIGGY", "PERSISTENT", "OBEROIRLTY", "SUPREMEIND", "LAURUSLABS",
              "AMBUJACEM"
          ]
          print("CANONICAL 29: PASS")
          PY

      - name: Create deterministic Stage 6 test fixtures
        run: |
          mkdir -p /tmp/psy29_stage6
          python - <<'PY'
          import csv
          import json
                   from datetime import datetime, timezone, timedelta
          from pathlib import Path

          universe = json.loads(Path("config/psy29_live_universe_contract.json").read_text())
          symbols = [x["symbol"] for x in universe["universe"]]

          security_map = {
              "status": "PASS",
              "canonical_count": 29,
              "resolved_count": 29,
              "unique_security_id_count": 29,
              "mappings": [
                  {"symbol": symbol, "security_id": f"TEST_{i:03d}", "exchange": "NSE", "segment": "E"}
                  for i, symbol in enumerate(symbols, start=1)
              ]
          }
          Path("/tmp/psy29_stage6/security_map.json").write_text(json.dumps(security_map, indent=2))

          # Fresh relative to the CI runner and safely inside the 90-second freshness window.
          fixture_timestamp = (
              datetime.now(timezone.utc) - timedelta(seconds=30)
          ).isoformat(timespec="seconds").replace("+00:00", "Z")

          rows = []
          for i, symbol in enumerate(symbols):
              if i == 0:
                  values = (105, 100, 104, 101, 103, 98)
              elif i == 1:
                  values = (95, 100, 96, 99, 102, 97)
              else:
                  values = (100, 100, 100, 100, 102, 98)
              rows.append({
                  "symbol": symbol,
                  "timestamp": fixture_timestamp,
                  "last_price": values[0], "vwap": values[1], "ema9": values[2],
                  "ema20": values[3], "first15_high": values[4], "first15_low": values[5]
              })

          with open("/tmp/psy29_stage6/snapshot.csv", "w", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=[
                  "symbol", "timestamp", "last_price", "vwap", "ema9", "ema20",
                  "first15_high", "first15_low"
              ])
              writer.writeheader()
              writer.writerows(rows)

          print(f"TEST FIXTURES CREATED: {len(rows)} rows; timestamp={fixture_timestamp}")
          PY

      - name: Compile Stage 6 V2
        run: python -m py_compile scripts/step9_live_regime_v2.py

      - name: Run Stage 6 V2 deterministic validation
        run: |
          mkdir -p output/stage6
          python scripts/step9_live_regime_v2.py \
            --universe config/psy29_live_universe_contract.json \
            --profiles config/psy29_edge_profiles_v1.json \
            --security-map /tmp/psy29_stage6/security_map.json \
            --snapshot /tmp/psy29_stage6/snapshot.csv \
            --output output/stage6

      - name: HARD VERIFY Stage 6
        run: |
          python - <<'PY'
          import json
          import pandas as pd

          summary = json.load(open("output/stage6/stage6_summary.json"))
          result = pd.read_csv("output/stage6/PSY29_STAGE6_LIVE_REGIMES.csv")

          assert summary["engine_execution_status"] == "PASS"
          assert summary["validation_status"] == "PASS"
          assert summary["status"] == "PASS"
          assert summary["universe_size"] == 29
          assert summary["profiles_verified"] == 29
          assert summary["security_ids_verified"] == 29
          assert summary["invalid_count"] == 0
          assert summary["stale_count"] == 0
          assert summary["fresh_count"] == 29
          assert len(result) == 29
          assert result["symbol"].nunique() == 29
          assert (result["trade_authorized"] == False).all()
          assert (result["trade_signal_generated"] == False).all()
          assert result.iloc[0]["regime"] == "BULLISH_BREAKOUT_REGIME"
          assert result.iloc[1]["regime"] == "BEARISH_BREAKDOWN_REGIME"
          assert result.iloc[2]["regime"] == "NEUTRAL_MIXED_REGIME"

          allowed = {
              "BULLISH_BREAKOUT_REGIME", "BEARISH_BREAKDOWN_REGIME",
              "BULLISH_ALIGNMENT_REGIME", "BEARISH_ALIGNMENT_REGIME",
              "BULLISH_WEAK_ALIGNMENT_REGIME", "BEARISH_WEAK_ALIGNMENT_REGIME",
              "NEUTRAL_MIXED_REGIME", "DATA_STALE", "DATA_INVALID"
          }
          assert set(result["regime"]).issubset(allowed)

          print("========================================")
          print("PSY29 STAGE 6 V2 HARD VERIFY: PASS")
          print("29/29 symbols processed")
          print("29/29 fresh")
          print("29/29 research profiles verified")
          print("29/29 security IDs verified")
          print("Trade authorization: FALSE")
          print("Trade signal generation: FALSE")
          print("========================================")
          PY

      - name: Upload Stage 6 validation output
        uses: actions/upload-artifact@v4
        with:
          name: psy29-stage6-regime-v2-validation
          path: output/stage6/
          if-no-files-found: error
