name: PSY29 Phase 6 Session Verification
on:
  push:
    paths:
      - '29stock-live-data-vault/phase6/**'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run session feature tests
        working-directory: 29stock-live-data-vault/phase6
        run: python -m unittest discover -s . -p 'test_*.py'
