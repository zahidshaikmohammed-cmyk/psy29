name: PSY29 Step 2 - Historical Data Acquisition

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2026-01-01"

      to_date:
        description: "End date (YYYY-MM-DD)"
        required: true
        default: "2026-08-13"

permissions:
  contents: read

jobs:
  acquire-history:
    name: acquire-history
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout PSY29
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Setup Python
      # ---------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ---------------------------------------------------------
      # 3. Install dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------------------------------------------
      # 4. Verify repository structure
      # ---------------------------------------------------------
      - name: Verify PSY29 structure
        run: |
          echo "Repository:"
          pwd

          echo ""
          echo "Top-level files:"
          find . -maxdepth 2 -type f | sort

          echo ""
          echo "Checking Dhan package..."

          test -f dhan/__init__.py || {
            echo "ERROR: dhan/__init__.py is missing."
            exit 1
          }

          test -f dhan/client.py || {
            echo "ERROR: dhan/client.py is missing."
            exit 1
          }

          test -f dhan/historical.py || {
            echo "ERROR: dhan/historical.py is missing."
            exit 1
          }

          test -f dhan/instruments.py || {
            echo "ERROR: dhan/instruments.py is missing."
            exit 1
          }

          test -f scripts/acquire_fno_history.py || {
            echo "ERROR: acquisition script is missing."
            exit 1
          }

          echo ""
          echo "PSY29 repository structure OK."

      # ---------------------------------------------------------
      # 5. Verify Python can import PSY29 modules
      # ---------------------------------------------------------
      - name: Verify Python imports
        run: |
          python -c "from dhan.client import DhanClient; from dhan.historical import fetch_intraday; from dhan.instruments import download_master; print('PSY29 Dhan modules import successfully.')"

      # ---------------------------------------------------------
      # 6. Verify secrets
      # ---------------------------------------------------------
      - name: Verify secrets are configured
        shell: bash
        run: |
          if [ -z "$DHAN_ACCESS_TOKEN" ]; then
            echo "ERROR: DHAN_ACCESS_TOKEN GitHub Secret is missing."
            exit 1
          fi

          if [ -z "$DHAN_CLIENT_ID" ]; then
            echo "WARNING: DHAN_CLIENT_ID is not configured."
          else
            echo "Dhan credentials detected."
          fi

      # ---------------------------------------------------------
      # 7. Run PSY29 historical acquisition
      # ---------------------------------------------------------
      - name: Run PSY29 historical acquisition
        run: |
          echo "Starting PSY29 Step 2..."
          echo "From: ${{ inputs.from_date }}"
          echo "To:   ${{ inputs.to_date }}"
          echo ""

          python -m scripts.acquire_fno_history \
            --from-date "${{ inputs.from_date }}" \
            --to-date "${{ inputs.to_date }}"

      # ---------------------------------------------------------
      # 8. Verify downloaded data
      # ---------------------------------------------------------
      - name: Verify acquired dataset
        run: |
          echo "Checking acquired data..."

          mkdir -p output

          FILE_COUNT=$(find data/raw/intraday -type f -name "*.parquet" 2>/dev/null | wc -l)

          echo "Parquet files acquired: $FILE_COUNT"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: No historical data files were created."
            exit 1
          fi

          echo ""
          echo "Acquired files:"
          find data/raw/intraday -type f -name "*.parquet" | sort

      # ---------------------------------------------------------
      # 9. Generate acquisition manifest
      # ---------------------------------------------------------
      - name: Generate acquisition manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime, timezone

          root = Path("data/raw/intraday")
          files = sorted(root.glob("*.parquet"))

          manifest = {
              "project": "PSY29",
              "step": 2,
              "status": "acquisition_complete",
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "from_date": "${{ inputs.from_date }}",
              "to_date": "${{ inputs.to_date }}",
              "file_count": len(files),
              "files": [
                  {
                      "symbol": f.stem,
                      "filename": f.name,
                      "bytes": f.stat().st_size
                  }
                  for f in files
              ]
          }

          Path("output/acquisition_manifest.json").write_text(
              json.dumps(manifest, indent=2),
              encoding="utf-8"
          )

          print(json.dumps(manifest, indent=2))
          PY

      # ---------------------------------------------------------
      # 10. Upload dataset as GitHub Actions artifact
      # ---------------------------------------------------------
      - name: Upload historical dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: psy29-step2-intraday-${{ inputs.from_date }}-${{ inputs.to_date }}
          path: |
            data/raw/intraday/
            output/acquisition_manifest.json
          retention-days: 7
          if-no-files-found: error

      # ---------------------------------------------------------
      # 11. Final status
      # ---------------------------------------------------------
      - name: PSY29 Step 2 completion
        run: |
          echo ""
          echo "=============================================="
          echo "PSY29 STEP 2 DATA ACQUISITION COMPLETE"
          echo "=============================================="
          echo ""
          echo "Historical dataset successfully acquired."
          echo "The artifact has been uploaded to GitHub Actions."
