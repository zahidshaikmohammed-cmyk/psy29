name: PSY29 Live End-to-End Signal Pipeline Gate

on:
  push:
    paths:
      - "scripts/psy29_accuracy_unit_tests.py"
      - "scripts/psy29_temporal_integrity_unit_tests.py"
      - "scripts/psy29_live_signal_cycle.py"
      - "scripts/psy29_live_end_to_end_gate.py"
      - "scripts/psy29_live_pipeline_service_cycle.py"
      - "scripts/psy29_live_pipeline_fixture.py"
      - "scripts/psy29_live_pipeline_bridge.py"
      - "scripts/psy29_live_dhan_acquisition.py"
      - "scripts/step9_live_regime_v2.py"
      - "scripts/stage7_edge_activation.py"
      - "scripts/stage8_edge_ranking.py"
      - "scripts/stage9_candidate_quality.py"
      - "scripts/stage10_integrity_gate.py"
      - "scripts/stage11_execution_analysis.py"
      - "scripts/stage12_execution_readiness.py"
      - "scripts/stage13_scenario_adjudication.py"
      - "scripts/stage14_live_dashboard.py"
      - "scripts/stage15_trade_event_journal.py"
      - "scripts/stage16_live_decision_consolidation.py"
      - "scripts/stage17_live_stability.py"
      - "scripts/stage18_historical_continuity.py"
      - "scripts/stage19_forward_transition.py"
      - "scripts/stage19_test_fixture.py"
      - "scripts/stage20_final_trading_signal_engine.py"
      - "scripts/stage20_test_fixture.py"
      - "config/psy29_live_universe_contract.json"
      - "config/psy29_live_dhan_data_contract.json"
      - "config/psy29_edge_profiles_v1.json"
      - "config/psy29_stage7_edge_activation_contract.json"
      - "config/psy29_stage8_edge_ranking_contract.json"
      - "config/psy29_stage9_candidate_quality_contract.json"
      - "config/psy29_stage10_integrity_gate_contract.json"
      - "config/psy29_stage11_execution_analysis_contract.json"
      - "config/psy29_stage12_execution_readiness_contract.json"
      - "config/psy29_stage13_scenario_adjudication_contract.json"
      - "config/psy29_stage14_live_dashboard_contract.json"
      - "config/psy29_stage19_forward_state_transition_contract.json"
      - "config/psy29_stage20_final_trading_signal_contract.json"
      - ".github/workflows/psy29-live-end-to-end-verify.yml"
  schedule:
    # Exact NSE verification window: 09:35-15:30 IST = 04:05-10:00 UTC, Mon-Fri.
    - cron: "*/5 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Verification mode: fixture off-market or live during NSE session"
        required: true
        default: "fixture"
        type: choice
        options:
          - fixture
          - live

permissions:
  contents: read

jobs:
  gate:
    name: PSY29 live end-to-end gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PSY29
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PSY29 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile live pipeline and Stage 5-20 verification modules
        run: |
          python -m py_compile scripts/psy29_accuracy_unit_tests.py scripts/psy29_temporal_integrity_unit_tests.py scripts/psy29_live_signal_cycle.py scripts/psy29_live_end_to_end_gate.py scripts/psy29_live_pipeline_service_cycle.py scripts/psy29_live_pipeline_fixture.py scripts/psy29_live_pipeline_bridge.py scripts/psy29_live_dhan_acquisition.py scripts/step9_live_regime_v2.py scripts/stage7_edge_activation.py scripts/stage8_edge_ranking.py scripts/stage9_candidate_quality.py scripts/stage10_integrity_gate.py scripts/stage11_execution_analysis.py scripts/stage12_execution_readiness.py scripts/stage13_scenario_adjudication.py scripts/stage14_live_dashboard.py scripts/stage15_trade_event_journal.py scripts/stage16_live_decision_consolidation.py scripts/stage17_live_stability.py scripts/stage18_historical_continuity.py scripts/stage19_forward_transition.py scripts/stage19_test_fixture.py scripts/stage20_final_trading_signal_engine.py scripts/stage20_test_fixture.py
          echo "PSY29 LIVE E2E PYTHON SYNTAX: PASS"
      - name: Run Stage 17 temporal-integrity regression
        run: python scripts/psy29_temporal_integrity_unit_tests.py
      - name: Run pinpoint acquisition accuracy unit tests
        run: python scripts/psy29_accuracy_unit_tests.py
      - name: Verify Stage 19 startup contract
        run: |
          python - <<'PY'
          import json
          c=json.load(open('config/psy29_stage19_forward_state_transition_contract.json',encoding='utf-8'))
          p=c['startup_policy']
          assert p['insufficient_history_state']=='INSUFFICIENT_TRANSITION_EVIDENCE'
          assert p['evidence_status']=='UNAVAILABLE'
          assert p['does_not_invalidate_independent_setup'] is True
          assert p['fabricate_transition_evidence'] is False
          c20=json.load(open('config/psy29_stage20_final_trading_signal_contract.json',encoding='utf-8'))
          p20=c20['stage19_startup_policy']
          assert p20['insufficient_transition_state']=='INSUFFICIENT_TRANSITION_EVIDENCE'
          assert p20['transition_evidence_status']=='UNAVAILABLE'
          assert p20['independent_setup_may_proceed'] is True
          assert p20['fabrication_forbidden'] is True
          print('STAGE 19 STARTUP CONTRACT: PASS')
          print('Stage 19 unavailable != invalid: PASS')
          print('Stage 20 independent setup may proceed: PASS')
          PY
      - name: Run deterministic Stage 20 startup-policy regression
        run: |
          rm -rf /tmp/psy29-stage20-startup
          mkdir -p /tmp/psy29-stage20-startup
          python - <<'PY'
          import csv,json
          from datetime import datetime,timezone
          from pathlib import Path
          u=json.load(open('config/psy29_live_universe_contract.json',encoding='utf-8'))['universe']
          syms=[str(x['symbol']).strip().upper() for x in u]
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          root=Path('/tmp/psy29-stage20-startup')
          def write(name,rows):
              with (root/name).open('w',encoding='utf-8',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
          s11=[];s16=[];s19=[]
          for i,s in enumerate(syms):
              candidate=i==0
              s11.append({'symbol':s,'structure_state':'BREAKOUT_STRUCTURE' if candidate else 'NONE','close_5m':'101','first15_high':'100','first15_low':'95','swing_high':'108','swing_low':'95','session_high':'110','session_low':'90','timestamp':now,'stage11_provenance':'test-stage11'})
              s16.append({'symbol':s,'system_state':'PRIMARY_CANDIDATE' if candidate else 'NO_SIGNAL','stage13_scenario':'BREAKOUT' if candidate else 'NONE','stage13_confidence':'0.80' if candidate else '0.0','timestamp':now,'stage16_provenance':'test-stage16'})
              s19.append({'symbol':s,'stage19_state':'INSUFFICIENT_TRANSITION_EVIDENCE','transition_evidence_status':'UNAVAILABLE','timestamp':now,'stage19_provenance':'test-stage19'})
          write('stage11.csv',s11);write('stage16.csv',s16);write('stage19.csv',s19)
          (root/'memory.json').write_text(json.dumps({'records':[]}),encoding='utf-8')
          PY
          python scripts/stage20_final_trading_signal_engine.py --contract config/psy29_stage20_final_trading_signal_contract.json --universe config/psy29_live_universe_contract.json --stage11 /tmp/psy29-stage20-startup/stage11.csv --stage16 /tmp/psy29-stage20-startup/stage16.csv --stage19 /tmp/psy29-stage20-startup/stage19.csv --memory /tmp/psy29-stage20-startup/memory.json --output /tmp/psy29-stage20-startup/out
          python - <<'PY'
          import json
          p=json.load(open('/tmp/psy29-stage20-startup/out/PSY29_STAGE20_FINAL_SIGNAL_BOARD.json',encoding='utf-8'))
          assert p['coverage']=={'expected':29,'actual':29,'unique':29}
          assert p['signal_count']==1
          s=p['signals'][0]
          assert s['stage19_state']=='INSUFFICIENT_TRANSITION_EVIDENCE'
          assert s['transition_evidence_status']=='UNAVAILABLE'
          assert s['take_profit']==110.0
          assert any(x['decision']=='SIGNAL' and 'unavailable' in x['reason'].lower() for x in p['audit'])
          print('STAGE 20 STARTUP POLICY: PASS')
          print('INSUFFICIENT_TRANSITION_EVIDENCE is non-blocking: PASS')
          print('Independent valid setup survives missing transition depth: PASS')
          print('No transition evidence fabricated: PASS')
          PY
      - name: Verify canonical universe and locked safety boundary
        run: |
          python - <<'PY'
          import json
          u=json.load(open('config/psy29_live_universe_contract.json',encoding='utf-8'))
          rows=u['universe']; symbols=[str(x['symbol']).strip().upper() for x in rows]; ranks=[int(x['rank']) for x in rows]
          assert len(rows)==29 and len(set(symbols))==29 and ranks==list(range(1,30))
          c=json.load(open('config/psy29_stage20_final_trading_signal_contract.json',encoding='utf-8'))
          assert c['coverage']==29 and c['signal_policy']['multiple_signals_allowed'] is True and c['signal_policy']['daily_signal_cap'] is None
          assert c['strategies']['BREAKOUT']['target_source']=='stage11.session_high_or_session_low'
          assert c['strategies']['BREAKDOWN']['target_source']=='stage11.session_low_or_session_high'
          print('CANONICAL 29: PASS'); print('STAGE 20 LOCKED POLICY: PASS')
          PY
      - name: Run deterministic Stage 20 blocker-1 fixture regression
        run: |
          rm -rf /tmp/psy29-stage20-fixture /tmp/psy29-stage20-out
          python scripts/stage20_test_fixture.py --universe config/psy29_live_universe_contract.json --output /tmp/psy29-stage20-fixture
          python scripts/stage20_final_trading_signal_engine.py --contract config/psy29_stage20_final_trading_signal_contract.json --universe config/psy29_live_universe_contract.json --stage11 /tmp/psy29-stage20-fixture/stage11.csv --stage16 /tmp/psy29-stage20-fixture/stage16.csv --stage19 /tmp/psy29-stage20-fixture/stage19.csv --memory /tmp/psy29-stage20-fixture/memory.csv --output /tmp/psy29-stage20-out
          python - <<'PY'
          import json
          p=json.load(open('/tmp/psy29-stage20-out/PSY29_STAGE20_FINAL_SIGNAL_BOARD.json',encoding='utf-8'))
          assert p['coverage']=={'expected':29,'actual':29,'unique':29} and p['signal_count']>=2
          strategies={x['strategy'] for x in p['signals']}; assert 'BREAKOUT' in strategies and 'BREAKDOWN' in strategies
          print('STAGE 20 BLOCKER 1 FIXTURE: PASS')
          PY
      - name: Run genuine end-to-end gate
        env:
          GATE_MODE: ${{ github.event_name == 'schedule' && 'live' || (github.event_name == 'workflow_dispatch' && inputs.mode || 'fixture') }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
        run: |
          rm -rf /tmp/psy29-live-e2e
          python scripts/psy29_live_end_to_end_gate.py --mode "$GATE_MODE" --output /tmp/psy29-live-e2e
      - name: Execute Stage 20 against genuine pipeline outputs
        env:
          GATE_MODE: ${{ github.event_name == 'schedule' && 'live' || (github.event_name == 'workflow_dispatch' && inputs.mode || 'fixture') }}
        run: |
          rm -rf /tmp/psy29-stage20-live-out
          python scripts/stage20_final_trading_signal_engine.py --contract config/psy29_stage20_final_trading_signal_contract.json --universe config/psy29_live_universe_contract.json --stage11 /tmp/psy29-live-e2e/execution_snapshot.csv --stage16 /tmp/psy29-live-e2e/stage16/PSY29_STAGE16_CURRENT_BOARD.csv --stage19 /tmp/psy29-live-e2e/stage19/PSY29_STAGE19_TRANSITION_BOARD.csv --memory /tmp/psy29-live-e2e/no-memory.csv --output /tmp/psy29-stage20-live-out
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/psy29-stage20-live-out/PSY29_STAGE20_FINAL_SIGNAL_BOARD.json').read_text())
          m=json.loads(Path('/tmp/psy29-live-e2e/PSY29_LIVE_END_TO_END_GATE.json').read_text())
          assert p['coverage']=={'expected':29,'actual':29,'unique':29} and len(p['audit'])==29
          assert p['daily_signal_cap'] is None
          assert m['stage19_live_derived'] is True
          print('STAGE 20 GENUINE E2E INVOCATION: PASS')
          print('Stage 20 received 29/29 pipeline records: PASS')
          print(f"Stage 20 signals: {p['signal_count']}")
          PY
      - name: HARD VERIFY genuine gate result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/psy29-live-e2e/PSY29_LIVE_END_TO_END_GATE.json').read_text())
          p=json.loads(Path('/tmp/psy29-stage20-live-out/PSY29_STAGE20_FINAL_SIGNAL_BOARD.json').read_text())
          mode=m['mode']
          assert m['status']=='PASS' and m['coverage']=={'expected':29,'actual':29,'unique':29}
          assert m['live_snapshot_to_stage16'] and m['stage17_live_derived'] and m['stage18_live_derived'] and m['stage19_live_derived'] and m['stage20_input_compatibility']
          if mode=='live':
              assert m['stage19_history_source']=='NONE_FAIL_CLOSED'
          assert p['coverage']=={'expected':29,'actual':29,'unique':29} and len(p['audit'])==29 and p['daily_signal_cap'] is None
          print('PSY29 GENUINE LIVE END-TO-END GATE: HARD VERIFY PASS')
          print(f'Mode: {mode}')
          print('DHAN -> Stages 6-19 -> Stage 20: PASS')
          print('No fixture Stage 17/18/19 enters live mode: PASS')
          PY
      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: psy29-live-end-to-end-gate
          path: /tmp/psy29-live-e2e/
          if-no-files-found: error
          include-hidden-files: true
