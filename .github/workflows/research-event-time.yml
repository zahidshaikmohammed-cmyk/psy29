name: PSY29 Research Event-Time Discovery
on:
  push:
    branches: [research-event-time-20260815]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow
      - name: Download canonical Step 2 dataset
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 31702235542
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: psy29-step2-intraday-*
          path: input
          merge-multiple: true
      - name: Locate parquet files
        run: |
          mkdir -p data/raw/intraday
          find input -type f -name '*.parquet' -exec cp {} data/raw/intraday/ \;
          test "$(find data/raw/intraday -type f -name '*.parquet' | wc -l)" -gt 0
      - name: Run event-time discovery
        run: python research/event_time_discovery.py
      - uses: actions/upload-artifact@v4
        with:
          name: psy29-event-time-discovery-20260815
          path: |
            event_time_summary.csv
            event_time_validation.csv
          retention-days: 30
