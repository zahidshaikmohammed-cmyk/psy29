name: PSY29 Step 4 - Behavioural Feature Engine

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Step 2 run ID containing the complete intraday artifact"
        required: true
        default: "31702235542"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  behavioural-features:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout PSY29
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'pandas>=2.2,<3' 'numpy>=2.0,<3' 'pyarrow>=17,<20'
      - name: Download Step 2 dataset
        uses: actions/download-artifact@v4
        with:
          name: psy29-step2-intraday-2026-01-01-2026-08-13
          path: input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: Run Step 4 behavioural feature engine
        run: python scripts/step4_features.py --input input/data/raw/intraday --output output/step4
      - name: Write provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/step4/step4_summary.json')
          d=json.loads(p.read_text())
          d['source_run_id']=int('${{ inputs.source_run_id }}')
          d['source_artifact']='psy29-step2-intraday-2026-01-01-2026-08-13'
          p.write_text(json.dumps(d,indent=2))
          PY
      - name: Upload Step 4 features
        uses: actions/upload-artifact@v4
        with:
          name: psy29-step4-behaviour-features
          path: output/step4/
          retention-days: 30
          if-no-files-found: error
