name: PSY29 Stage 7 - Research Conditioned Edge Activation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage7:
    name: Validate PSY29 Research-Conditioned Edge Activation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PSY29
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Verify Stage 5 and Stage 6 inputs
        run: |
          test -f config/psy29_live_universe_contract.json
          test -f config/psy29_edge_profiles_v1.json
          test -f config/psy29_stage7_edge_activation_contract.json
          test -f scripts/step9_live_regime_v2.py
          test -f scripts/stage7_edge_activation.py

      - name: Verify canonical 29 and Stage 5 profiles
        run: |
          python - <<'PY'
          import json
          u = json.load(open("config/psy29_live_universe_contract.json"))
          p = json.load(open("config/psy29_edge_profiles_v1.json"))
          symbols = [x["symbol"] for x in u["universe"]]
          profile_symbols = [x["symbol"] for x in p["profiles"]]
          assert len(symbols) == 29 and len(set(symbols)) == 29
          assert profile_symbols and set(profile_symbols) == set(symbols)
          assert len(profile_symbols) == 29
          print("CANONICAL 29 + STAGE 5 PROFILES: PASS")
          PY

      - name: Create deterministic Stage 6 input fixtures
        run: |
          mkdir -p /tmp/psy29_stage7
          python - <<'PY'
          import csv
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          u = json.loads(Path("config/psy29_live_universe_contract.json").read_text())
          symbols = [x["symbol"] for x in u["universe"]]
          ts = (datetime.now(timezone.utc) - timedelta(minutes=2)).isoformat(timespec="seconds").replace("+00:00", "Z")

          security_map = {
              "status": "PASS",
              "canonical_count": 29,
              "resolved_count": 29,
              "unique_security_id_count": 29,
              "mappings": [
                  {"symbol": s, "security_id": f"TEST_{i:03d}", "exchange": "NSE", "segment": "E"}
                  for i, s in enumerate(symbols, 1)
              ]
          }
          Path("/tmp/psy29_stage7/security_map.json").write_text(json.dumps(security_map, indent=2))

          rows = []
          for i, symbol in enumerate(symbols):
              if symbol == "NESTLEIND":
                  # Bullish breakout, but OR continuation rate is below the 29-stock median.
                  vals = (105, 100, 104, 101, 103, 98)
              elif symbol == "ICICIPRULI":
                  # Bearish breakdown, with OR continuation above the median -> active.
                  vals = (95, 100, 96, 99, 102, 97)
              elif symbol == "TCS":
                  # Bullish alignment, trend rate above the median -> active.
                  vals = (101, 100, 101, 100, 102, 98)
              elif symbol == "AMBUJACEM":
                  # Bearish alignment, trend rate below the median -> inactive.
                  vals = (99, 100, 99, 100, 102, 98)
              else:
                  # Neutral mixed regime.
                  vals = (100, 100, 100, 100, 102, 98)

              rows.append({
                  "symbol": symbol,
                  "timestamp": ts,
                  "last_price": vals[0],
                  "vwap": vals[1],
                  "ema9": vals[2],
                  "ema20": vals[3],
                  "first15_high": vals[4],
                  "first15_low": vals[5]
              })

          with open("/tmp/psy29_stage7/snapshot.csv", "w", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=[
                  "symbol", "timestamp", "last_price", "vwap", "ema9", "ema20", "first15_high", "first15_low"
              ])
              writer.writeheader()
              writer.writerows(rows)
          print(f"STAGE 6 TEST FIXTURE CREATED: 29 rows; timestamp={ts}")
          PY

      - name: Run Stage 6 V2 fixture producer
        run: |
          mkdir -p /tmp/psy29_stage7/stage6
          python scripts/step9_live_regime_v2.py \
            --universe config/psy29_live_universe_contract.json \
            --profiles config/psy29_edge_profiles_v1.json \
            --security-map /tmp/psy29_stage7/security_map.json \
            --snapshot /tmp/psy29_stage7/snapshot.csv \
            --output /tmp/psy29_stage7/stage6

      - name: Compile Stage 7
        run: python -m py_compile scripts/stage7_edge_activation.py

      - name: Run Stage 7 deterministic validation
        run: |
          mkdir -p output/stage7
          python scripts/stage7_edge_activation.py \
            --universe config/psy29_live_universe_contract.json \
            --profiles config/psy29_edge_profiles_v1.json \
            --contract config/psy29_stage7_edge_activation_contract.json \
            --regimes /tmp/psy29_stage7/stage6/PSY29_STAGE6_LIVE_REGIMES.csv \
            --output output/stage7

      - name: HARD VERIFY Stage 7
        run: |
          python - <<'PY'
          import json
          import pandas as pd

          summary = json.load(open("output/stage7/stage7_summary.json"))
          df = pd.read_csv("output/stage7/PSY29_STAGE7_EDGE_ACTIVATION.csv")

          assert summary["engine_execution_status"] == "PASS"
          assert summary["validation_status"] == "PASS"
          assert summary["status"] == "PASS"
          assert summary["coverage"] == 29
          assert len(df) == 29
          assert df["symbol"].nunique() == 29
          assert set(df["activation"]).issubset({"EDGE_ACTIVE", "EDGE_INACTIVE", "DATA_STALE", "DATA_INVALID"})
          assert (df["trade_authorized"] == False).all()
          assert (df["trade_signal_generated"] == False).all()
          assert (df["research_profile_source"] == "config/psy29_edge_profiles_v1.json").all()

          # Deterministic semantic checks.
          r = df.set_index("symbol")
          assert r.loc["NESTLEIND", "activation"] == "EDGE_INACTIVE"
          assert r.loc["NESTLEIND", "reason_code"] == "OR_CONTINUATION_BELOW_REFERENCE"
          assert r.loc["ICICIPRULI", "activation"] == "EDGE_ACTIVE"
          assert r.loc["ICICIPRULI", "reason_code"] == "OR_CONTINUATION_MATCH"
          assert r.loc["TCS", "activation"] == "EDGE_ACTIVE"
          assert r.loc["TCS", "reason_code"] == "TREND_RATE_MATCH"
          assert r.loc["AMBUJACEM", "activation"] == "EDGE_INACTIVE"
          assert r.loc["AMBUJACEM", "reason_code"] == "TREND_RATE_BELOW_REFERENCE"

          assert summary["edge_active_count"] == 2
          assert summary["edge_inactive_count"] == 27
          assert summary["data_stale_count"] == 0
          assert summary["data_invalid_count"] == 0

          print("========================================")
          print("PSY29 STAGE 7 HARD VERIFY: PASS")
          print("29/29 coverage")
          print("2 EDGE_ACTIVE")
          print("27 EDGE_INACTIVE")
          print("0 DATA_STALE")
          print("0 DATA_INVALID")
          print("Trade authorization: FALSE")
          print("Trade signal generation: FALSE")
          print("========================================")
          PY

      - name: Upload Stage 7 validation output
        uses: actions/upload-artifact@v4
        with:
          name: psy29-stage7-edge-activation-validation
          path: output/stage7/
          if-no-files-found: error
